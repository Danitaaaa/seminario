version: '3.8'

services:
  postgres_1:
    image: postgres:18.6
    container_name: app_postgres_1
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_1:-studyAppDB}
      POSTGRES_USER: ${POSTGRES_USER_1:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_1:-secret1}
    ports:
      - "${POSTGRES_PORT_1:-5433}:5432"
    volumes:
      - pgdata_1:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_1:-admin} -d ${POSTGRES_DB_1:-studyAppDB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_2:
    image: postgres:18.6
    container_name: app_postgres_2
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_2:-studyAppDB}
      POSTGRES_USER: ${POSTGRES_USER_2:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_2:-secret2}
    ports:
      - "${POSTGRES_PORT_2:-5434}:5432"
    volumes:
      - pgdata_2:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_2:-admin} -d ${POSTGRES_DB_2:-studyAppDB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_1:
  pgdata_2: